<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Personal Portal</title>

   
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      padding: 30px;
    }
      .portal-container {
      max-width: 400px;
      margin: auto;
      padding: 20px;
      border: 3px solid #003366;  
      border-radius: 15px;
      background-color: #ffffff;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    .portal-title {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #002244;
      margin-bottom: 10px;
    }

    .portal-label {
      text-align: center;
      font-size: 16px;
      color: #555555;
      margin-bottom: 20px;
    }

    
    .login-box {
      border: 2px solid #003366;
      background-color: #e6f0ff;
      padding: 10px 0;
      text-align: center;
      font-weight: bold;
      color: #003366;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 20px;
    }

    form {
      padding: 0;
      margin: 0;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input, button {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #003366;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #0055aa;
    }

    .register-link {
      margin-top: 15px;
      text-align: center;
    }

    .register-link a {
      text-decoration: none;
      color: white;
      background-color: #008000;
      padding: 8px 12px;
      border-radius: 5px;
      display: inline-block;
    }

    .register-link a:hover {
      background-color: #00aa00;
    }
  </style>
</head>

<body>

  
  <div class="portal-container">
     
    <div class="portal-title">Student Personal Portal</div>
    <div class="portal-label">Welcome! Please login with your student ID and password.</div>

     
    <div class="login-box">Student Login</div>

   
    <form method="post" action="login.php">
      <label>Student ID:</label>
      <input type="text" name="student_id" placeholder="Enter Student ID">

      <label>Password:</label>
      <input type="password" name="password" placeholder="Enter Password">

      <button type="submit">Login</button>

       
      <div class="register-link">
        <a href="register.html">New Student? Register Here</a>
      </div>
    </form>
  </div>

</body>
</html>
