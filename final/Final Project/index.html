<!DOCTYPE HTML>
<HTML>
<HEAD>
  <TITLE>Student Personal Portal</TITLE>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f0f8ff; 
    }
 
    h2 {
      text-align: center;
      color: #003366;
    }
 
    form {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
      margin: 0 auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
 
    input, select, button {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box; 
    }
 
    label {
      display: block;
      margin-top: 10px;
      font-size: 14px;
    }
 
    button {
      background-color: #003366;
      color: white;
      cursor: pointer;
      border: none;
    }
 
    button:hover {
      background-color: #0055aa;
    }
 
    #output {
      margin-top: 20px;
      text-align: center;
      font-size: 16px;
      color: #003366;
    }
 
    #error {
      margin-top: 10px;
      color: red;
      text-align: center;
    }

    .register-link {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
    }
    
    .register-link a {
      color: #003366;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</HEAD>
<BODY>
 
  <h2>Student Login</h2>
 
  <form action="login.php" method="POST" onsubmit="return handleSubmit()">
    <label>Student ID:</label>
    <input type="text" id="studentId" name="studentId" placeholder="Enter Student ID" />
 
    <label>Password:</label>
    <input type="password" id="pass" name="pass" placeholder="Enter Password" />

    <button type="submit">Login</button>

    <div class="register-link">
      <a href="register.html">New Student? Register Here</a>
    </div>
  </form>

  <div id="error"></div>
  <div id="output"></div>
 
  <script>
    function handleSubmit() {
      
      var studentId = document.getElementById("studentId").value.trim();
      var pass = document.getElementById("pass").value;
      var errorDiv = document.getElementById("error");
      
      
      errorDiv.innerHTML = "";
      
      
      if (studentId === "" || pass === "") {
        errorDiv.innerHTML = "Please fill in all fields.";
        return false;  
      }

       
      return true; 
    }
  </script>
 
</BODY>
</HTML>
